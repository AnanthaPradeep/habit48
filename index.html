<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habit48</title><style>body{font:16px system-ui;background:#f3f4ee;color:#233d31;max-width:650px;margin:auto;padding:16px}section,header{background:white;padding:20px;border-radius:16px;margin-bottom:12px}header,button{background:#233d31;color:white}button,input,textarea,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccc}textarea,input:not([type=checkbox]){width:100%;box-sizing:border-box}label{display:block;margin:12px 0}progress{width:100%;accent-color:#648557}</style><header><h1>Habit48</h1><p>48 days · One day at a time</p><p id="summary"></p><progress id="overall" max="48"></progress></header><section><label>Start date<input id="start" type="date"></label><label>Challenge day <select id="day"></select></label><p id="date"></p><h2>Daily habits</h2><div id="habits"></div><p id="score"></p></section><section><h2>Food journal</h2><div id="food"></div></section><section><h2>Activity & recovery</h2><div id="metrics"></div><label>Notes<textarea id="notes"></textarea></label><button id="save">Save day</button><p id="status"></p></section><section><h2>Weekly progress</h2><div id="weeks"></div><button id="backup">Export backup</button></section><script>const $=id=>document.getElementById(id),h=['Avoid added sugar','Avoid sweetened juice','Reduce fried food','Limit porotta','Moderate protein','Walk 30–45 minutes','Adequate water','Sleep 7–9 hours','Light timely dinner'],f=['Breakfast','Lunch','Snacks','Dinner','Drinks'],m=['Water (litres)','Walking (minutes)','Sleep (hours)','Weight (kg)','Strength training (minutes)'];let today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());let iso=today.toISOString().slice(0,10),d=JSON.parse(localStorage.getItem('habit48')||'null')||{start:iso,entries:{}};let n=Math.min(48,Math.max(1,1+Math.floor((Date.parse(iso)-Date.parse(d.start))/86400000)));$('day').innerHTML=Array.from({length:48},(_,i)=>'<option value="'+(i+1)+'">Day '+(i+1)+'</option>').join('');$('habits').innerHTML=h.map((v,i)=>'<label><input type="checkbox" id="h'+i+'"> '+v+'</label>').join('');$('food').innerHTML=f.map((v,i)=>'<label>'+v+'<textarea id="f'+i+'"></textarea></label>').join('');$('metrics').innerHTML=m.map((v,i)=>'<label>'+v+'<input type="number" min="0" step="any" id="m'+i+'"></label>').join('');function score(){$('score').textContent=h.filter((v,i)=>$('h'+i).checked).length+'/9 habits'}function render(){let e=d.entries[n]||{};$('start').value=d.start;$('day').value=n;$('date').textContent=new Date(Date.parse(d.start)+(n-1)*86400000).toISOString().slice(0,10);h.forEach((v,i)=>$('h'+i).checked=!!e.h?.[i]);f.forEach((v,i)=>$('f'+i).value=e.f?.[i]||'');m.forEach((v,i)=>$('m'+i).value=e.m?.[i]||'');$('notes').value=e.notes||'';$('overall').value=Object.keys(d.entries).length;$('summary').textContent=Object.keys(d.entries).length+'/48 days logged';$('weeks').innerHTML=Array.from({length:7},(_,w)=>{let a=Object.entries(d.entries).filter(([k])=>Math.floor((k-1)/7)===w);return '<p>Week '+(w+1)+': '+a.length+' days logged · '+a.filter(([k,e])=>Number(e.m[4])>0).length+' strength days (goal 2–3)</p>'}).join('');$('status').textContent=e.h?'Saved':'Not saved';score()}function persist(){localStorage.setItem('habit48',JSON.stringify(d))}$('day').onchange=()=>{n=+$('day').value;render()};$('start').onchange=()=>{if($('start').value){d.start=$('start').value;persist();render()}};$('habits').onchange=score;$('save').onclick=()=>{d.entries[n]={h:h.map((v,i)=>$('h'+i).checked),f:f.map((v,i)=>$('f'+i).value),m:m.map((v,i)=>$('m'+i).value),notes:$('notes').value};persist();render()};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='habit48.json';a.click()};render()</script></html>
