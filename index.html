<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#dfdce7" data-light="#dfdce7" data-dark="#292b39">
    <script>
      (() => {
        let preference
        try { preference = localStorage.getItem('routine-theme') } catch {}
        const theme = preference === 'light' || preference === 'dark' ? preference :
          matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        const meta = document.querySelector('meta[name="theme-color"]')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        meta.content = meta.dataset[theme]
      })()
    </script>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
    <meta name="description" content="My-Routine · Daily Balance. Your private wellness journal.">
    <meta property="og:title" content="My-Routine · Daily Balance">
    <meta property="og:description" content="Your private wellness journal.">
    <meta property="og:image" content="https://ananthapradeep.github.io/habit48/brand/icons/icon-1024-mr-rose-v2.png">
    <link rel="icon" href="%BASE_URL%brand/icons/favicon-mr-rose-v2.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%brand/icons/icon-16-mr-rose-v2.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%brand/icons/icon-32-mr-rose-v2.png">
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%brand/icons/icon-180-mr-rose-v2.png">
    <title>My-Routine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
